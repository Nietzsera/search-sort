<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bubble Sort Visualizer</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; }
        .back { display: inline-block; margin: 20px; color: #3498db; text-decoration: none; }
        .bars-container { display: flex; justify-content: center; align-items: flex-end; height: 200px; gap: 5px; margin: 30px auto; width: 80%; background: white; padding: 20px; border-radius: 8px; }
        .bar { width: 30px; background-color: #3498db; transition: 0.3s ease; color: white; font-size: 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <a class="back" href="index.html">← Kembali ke Menu</a>
    <h2>Bubble Sort Visualizer</h2>
    <div class="bars-container" id="container"></div>
    <button onclick="bubbleSort()">Mulai Sort</button>

    <script>
        const container = document.getElementById('container');
        let array = [45, 20, 80, 55, 12, 60, 33];

        function render() {
            container.innerHTML = '';
            array.forEach(val => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${val * 2}px`;
                bar.innerText = val;
                container.appendChild(bar);
            });
        }

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function bubbleSort() {
            let bars = document.getElementsByClassName('bar');
            for (let i = 0; i < array.length; i++) {
                for (let j = 0; j < array.length - i - 1; j++) {
                    bars[j].style.backgroundColor = '#e74c3c';
                    bars[j+1].style.backgroundColor = '#e74c3c';
                    await sleep(400);

                    if (array[j] > array[j+1]) {
                        let temp = array[j];
                        array[j] = array[j+1];
                        array[j+1] = temp;
                        render();
                        bars = document.getElementsByClassName('bar');
                        bars[j].style.backgroundColor = '#e74c3c';
                        bars[j+1].style.backgroundColor = '#e74c3c';
                    }
                    await sleep(200);
                    bars[j].style.backgroundColor = '#3498db';
                    bars[j+1].style.backgroundColor = '#3498db';
                }
                bars[array.length - i - 1].style.backgroundColor = '#2ecc71';
            }
        }
        render();
    </script>
</body>
</html>
